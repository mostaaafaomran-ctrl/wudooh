<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>وضوح | Arabic readability checker</title>
<meta name="description" content="Wudooh scores how easy an Arabic text is to read, flags long sentences and heavy words, and suggests simpler ones. Runs in your browser, nothing is uploaded.">
<meta property="og:title" content="وضوح | Wudooh">
<meta property="og:description" content="Paste Arabic text, get a readability score, long-sentence flags and simpler word suggestions.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='50' fill='%230a2540'/%3E%3Ccircle cx='50' cy='50' r='20' fill='none' stroke='%2300c2ff' stroke-width='9'/%3E%3C/svg%3E">
<style>
:root{--bg:#eef3f8;--ink:#0a2540;--dim:#5b7083;--ln:#d5e0ea;--ac:#0a84ff;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 "Noto Naskh Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
.top{background:var(--ink);color:#fff}
.top div{max-width:1000px;margin:0 auto;padding:16px 18px;display:flex;align-items:baseline;gap:12px}
.top b{font-size:28px;letter-spacing:.5px}.top span{color:#8fb4d9;font:14px system-ui;letter-spacing:2px}
.wrap{max-width:1000px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:clamp(26px,4.5vw,40px);margin:6px 0 4px;line-height:1.3}
.sub{color:var(--dim);margin:0 0 20px;font:15px system-ui}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px;box-shadow:0 1px 0 #fff,0 8px 24px -14px #0a254044}
textarea{width:100%;min-height:260px;border:1px solid var(--ln);border-radius:10px;padding:12px;font:inherit;color:var(--ink);resize:vertical;background:#fbfdff}
textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
button{font:600 15px system-ui;border:0;border-radius:9px;padding:9px 16px;background:var(--ink);color:#fff;cursor:pointer}
button.alt{background:#e3ecf5;color:var(--ink)}
.gauge{display:flex;align-items:center;gap:16px}
.ring{--p:0;--c:#0a84ff;width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#e3ecf5 0);display:grid;place-items:center;flex:none}
.ring i{width:100px;height:100px;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 34px system-ui;font-style:normal}
.lvl{font-size:26px;font-weight:700;line-height:1.2}.lvl small{display:block;font:14px system-ui;color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:#f2f7fb;border-radius:10px;padding:8px 10px;text-align:center;font:13px/1.3 system-ui;color:var(--dim)}
.stats b{display:block;font-size:20px;color:var(--ink)}
h3{margin:18px 0 6px;font-size:18px}
.empty{color:var(--dim);font:14px system-ui}
.chip{display:inline-block;background:#e8f2ff;border-radius:99px;padding:1px 12px;margin:3px;font-size:15px}
.chip s{color:#a33;text-decoration-thickness:1px}.chip b{color:#0a7a45}
.ls{background:#fff4e5;border-inline-start:4px solid #e07a1f;padding:6px 10px;margin:6px 0;border-radius:6px;font-size:15px}
.hl{background:#ffe3a3;border-radius:4px;padding:0 2px}.hs{border-bottom:3px solid #e07a1f}
#view{border:1px solid var(--ln);border-radius:10px;padding:12px;background:#fbfdff;max-height:260px;overflow:auto;margin-top:10px;font-size:16px}
footer{margin-top:30px;color:var(--dim);font:13px system-ui;direction:ltr;text-align:center}
</style>
</head>
<body>
<div class="top"><div><b>وضوح</b><span>WUDOOH</span></div></div>
<div class="wrap">
<h1>هل كلامك واضح؟</h1>
<p class="sub">Paste Arabic text. Get a readability score, long sentences, heavy words and simpler options.</p>
<div class="grid">
<div class="card">
<textarea id="t" dir="auto" placeholder="الصق النص هنا..."></textarea>
<div class="btns"><button id="demo">جرب مثال · Example</button><button class="alt" id="clr">مسح · Clear</button></div>
<div id="view" hidden></div>
</div>
<div class="card" id="res"><div class="empty">النتيجة هتظهر هنا · Results appear here</div></div>
</div>
<footer>MIT · github.com/mostaaafaomran-ctrl/wudooh · Heuristic score, not a linguistic standard</footer>
</div>
<script src="wudooh.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function run(){
  const t=$('t').value,a=Wudooh.analyze(t);
  if(!a){$('res').innerHTML='<div class="empty">النتيجة هتظهر هنا · Results appear here</div>';$('view').hidden=true;return}
  let h='<div class="gauge"><div class="ring" style="--p:'+a.score+';--c:'+a.lc+'"><i>'+a.score+'</i></div><div class="lvl">'+a.level[0]+'<small>'+a.level[1]+' · out of 100</small></div></div>';
  h+='<div class="stats"><div><b>'+a.words+'</b>words</div><div><b>'+a.sentences+'</b>sentences</div><div><b>'+a.readMin.toFixed(1)+'</b>min read</div><div><b>'+a.avgSent+'</b>words / sentence</div><div><b>'+a.avgWord+'</b>letters / word</div><div><b>'+a.longRatio+'%</b>long words</div></div>';
  h+='<h3>كلمات أبسط · Simpler words</h3>';
  h+=a.hits.length?a.hits.map(x=>'<span class="chip"><s>'+esc(x.from)+'</s> ← <b>'+(x.to||'احذفها')+'</b>'+(x.count>1?' ×'+x.count:'')+'</span>').join(''):'<div class="empty">No heavy words from the list found.</div>';
  h+='<h3>جمل طويلة · Long sentences</h3>';
  h+=a.longSent.length?a.longSent.map(s=>'<div class="ls">'+esc(s)+'</div>').join(''):'<div class="empty">No sentence is over 25 words.</div>';
  h+='<p class="empty" style="margin-top:14px">الاقتراحات بالعامية المصرية. اختار اللي يناسب جمهورك.</p>';
  $('res').innerHTML=h;
  const v=$('view');v.hidden=false;
  let html=a.sw.map(x=>{const e=esc(x.s);return x.n>25?'<span class="hs">'+e+'</span>':e}).join(' ');
  html=html.replace(/[\u0621-\u064A\u064B-\u065F\u0670]{7,}/g,m=>Wudooh.norm(m).length>=7?'<span class="hl">'+m+'</span>':m);
  v.innerHTML=html;
}
$('t').addEventListener('input',run);
$('clr').onclick=()=>{$('t').value='';run()};
$('demo').onclick=()=>{$('t').value='نظرا لأن الطالب يتوجب عليه أن يقوم بتسليم المشروع النهائي قبل الموعد المحدد من قبل الإدارة الأكاديمية، فإنه ينبغي عليه أن يستخدم الوقت المتاح لديه بصورة منهجية ومنظمة، علاوة على ضرورة التنسيق المستمر مع أعضاء الفريق لضمان اكتمال جميع المتطلبات المطلوبة. يجب أن نبدأ الآن. هذا سهل جدا.';run()};
if(new URLSearchParams(location.search).get('demo')==='1')$('demo').click();
</script>
</body>
</html>
